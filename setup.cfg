[nosetests]
verbosity=2
with-coverage=1
cover-package=service
cover-erase=1

[coverage:run]
source = service
branch = True

[coverage:report]
show_missing = True
fail_under = 0

[flake8]
max-line-length = 127
exclude = .git,__pycache__,venv,.venv
ignore = E203,E501,W503

[pylint]
disable = C0114,C0115,C0116
max-line-length = 127
